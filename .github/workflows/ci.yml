name: CI

on:
  push:
    # `version-16` là nhánh PHÁT HÀNH (README.md và HUONG_DAN_TRIEN_KHAI.md đều
    # hướng dẫn cài `bench get-app ... --branch version-16`), `main` là nhánh
    # trục. Liệt kê CẢ HAI để push lên nhánh nào cũng chạy CI — ⛔ không nhánh
    # nào bị bỏ sót trong im lặng.
    # Các nhánh làm việc cá nhân đã được trigger `pull_request` bên dưới phủ
    # (không lọc nhánh), nên ⛔ không cần — và không nên — hardcode tên nhánh
    # cá nhân vào đây.
    branches:
      - version-16
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    name: Server

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:11.8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Find tests
        run: |
          echo "Finding tests"
          grep -rn "def test" > /dev/null

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          check-latest: true

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py', '**/setup.cfg') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: 'echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT'

      - uses: actions/cache@v4
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install MariaDB Client
        run: |
          sudo apt update
          sudo apt-get install mariadb-client

      - name: Setup
        run: |
          pip install frappe-bench
          # Khoá nhánh Frappe = v16 ⇒ build tái lập được, khớp phiên bản
          # alumglass chạy thật (ERPNext/Frappe v16).
          bench init \
            --frappe-branch version-16 \
            --skip-redis-config-generation \
            --skip-assets \
            --python "$(which python)" ~/frappe-bench

      - name: Install
        working-directory: /home/runner/frappe-bench
        run: |
          # Thứ tự phụ thuộc: frappe (đã có từ bench init) → erpnext →
          # formula_builder → alumglass.
          # `alumglass.hooks.required_apps = ["formula_builder"]` ⇒ thiếu
          # formula_builder là `install-app alumglass` fail.
          # `alumglass.setup.custom_fields` tạo custom field trên Quotation và
          # Item Price (doctype của ERPNext) ⇒ thiếu erpnext là after_install fail.
          bench get-app erpnext --branch version-16
          bench get-app formula_builder https://github.com/lengoc1490/Formula-Builder.git --branch develop
          bench get-app alumglass $GITHUB_WORKSPACE
          bench setup requirements --dev
          bench new-site --db-root-password root --admin-password admin test_site
          bench --site test_site install-app erpnext
          bench --site test_site install-app formula_builder
          bench --site test_site install-app alumglass
          bench build
        env:
          CI: 'Yes'

      - name: Run Tests
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site set-config allow_tests true
          bench --site test_site run-tests --app alumglass
        env:
          TYPE: server
